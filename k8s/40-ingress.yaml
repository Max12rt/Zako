apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zako
  namespace: zako
spec:
  ingressClassName: nginx
  rules:
    - host: zako.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: monolith
                port:
                  number: 9090
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: monolith
                port:
                  number: 9090
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
