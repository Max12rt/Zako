services:
  postgres:
    image: postgres:16-alpine
    container_name: zako-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_monolith_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_monolith_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  monolith:
    build:
      context: ./monolith
    container_name: zako-monolith
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticket_monolith_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "9090:9090"

  frontend:
    build:
      context: ./frontend
    container_name: zako-frontend
    restart: unless-stopped
    depends_on:
      - monolith
    ports:
      - "8080:80"

volumes:
  postgres-data:
