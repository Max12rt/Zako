services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: zako-ms-postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-trip:
    image: postgres:16-alpine
    container_name: zako-ms-postgres-trip
    environment:
      POSTGRES_DB: trip_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5434:5432"
    volumes:
      - postgres-trip-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trip_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-ticket:
    image: postgres:16-alpine
    container_name: zako-ms-postgres-ticket
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5435:5432"
    volumes:
      - postgres-ticket-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: zako-ms-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "zako-cluster-id-123456"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: zako-ms-auth
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"
      JWT_SECRET: "ZGV2LXNlY3JldC1rZXktZm9yLXpha28tYXBwLTI1NmJpdHM="
    ports:
      - "8081:8081"

  trip-service:
    build:
      context: .
      dockerfile: trip-service/Dockerfile
    container_name: zako-ms-trip
    depends_on:
      postgres-trip:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-trip:5432/trip_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: "ZGV2LXNlY3JldC1rZXktZm9yLXpha28tYXBwLTI1NmJpdHM="
    ports:
      - "8082:8082"

  ticket-service:
    build:
      context: .
      dockerfile: ticket-service/Dockerfile
    container_name: zako-ms-ticket
    depends_on:
      postgres-ticket:
        condition: service_healthy
      kafka:
        condition: service_healthy
      trip-service:
        condition: service_started
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ticket:5432/ticket_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRIP_SERVICE_BASE_URL: http://trip-service:8082
      JWT_SECRET: "ZGV2LXNlY3JldC1rZXktZm9yLXpha28tYXBwLTI1NmJpdHM="
    ports:
      - "8083:8083"

  frontend:
    build:
      context: ../frontend
    container_name: zako-ms-frontend
    depends_on:
      - auth-service
      - trip-service
      - ticket-service
    volumes:
      - ../frontend/nginx-microservices.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"

volumes:
  postgres-auth-data:
  postgres-trip-data:
  postgres-ticket-data:
