spring.application.name=monolith

server.port=${SERVER_PORT:9090}

# Datasource — values come from environment variables; falls back to local dev defaults.
# For Supabase: set SPRING_DATASOURCE_URL/USERNAME/PASSWORD via .env or shell.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_monolith_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by db/supabase_init.sql when running against Supabase — keep validate, not update,
# so Hibernate doesn't try to mutate Supabase tables. For local dev (no migration script), set this
# to "update" via env var: SPRING_JPA_HIBERNATE_DDL_AUTO=update
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP — Supabase has connection limits on free tier; keep pool small.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT_MS:20000}
